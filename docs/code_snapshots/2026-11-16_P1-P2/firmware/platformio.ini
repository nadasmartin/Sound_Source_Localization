; PlatformIO project config: which chip, which framework, how to upload.
;
;   esp32       (default) on-board processing: detect the chirp, TDOA, 3D
;               position, all on the ESP32; JSON telemetry over USB serial.
;               Host side: host/telemetry.py
;   esp32_wifi  the old raw 4-mic stream over Wi-Fi (TCP 3333) for
;               host/mic_viewer.py and host/tdoa.py.  pio run -e esp32_wifi -t upload

[platformio]
default_envs = esp32

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 921600
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0
; Slower upload speed: this board did not respond to the fast default
upload_speed = 115200

[env:esp32]
build_src_filter = +<*> -<wifi_stream/>
build_unflags = -Os
build_flags = -O2

[env:esp32_wifi]
build_src_filter = +<wifi_stream/>
lib_ignore = tdoa
