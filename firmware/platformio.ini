; PlatformIO project config: which chip, which framework, how to upload.
;
;   esp32       on-board processing: detect the chirp, TDOA, 3D position,
;               all on the ESP32; JSON results over USB serial.
;               Host side: host/live_app.py, host/series.py, host/bench.py

[platformio]
default_envs = esp32

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 921600
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0
; Slower upload speed: this board did not respond to the fast default
upload_speed = 115200

[env:esp32]
; fingerprint of the sources -> "fw" in the status line (see fw_version.py)
extra_scripts = pre:fw_version.py
build_unflags = -Os
build_flags = -O2
